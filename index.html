<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pretty Prismatic Princess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: full-bleed night-sky canvas, a thin glass HUD strip on top, rainbow-rimmed card for menus */
:root{
  --night:#0b0320;
  --ink:#fdf7ff;
  --muted:#cbb9f0;
  --glass:rgba(24,8,56,.62);
  --card:rgba(22,7,52,.94);
  --gold:#ffd86b;
  --hot:#ff4f8b;
  --rainbow:linear-gradient(90deg,#ff3b6b,#ff9a3b,#ffe53b,#4dff88,#3bd5ff,#6b6bff,#d65bff);
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#game:active{cursor:grabbing}

#hud{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(11,3,32,.85),rgba(11,3,32,0));pointer-events:none}
.stat{display:flex;flex-direction:column;align-items:center;min-width:44px;line-height:1}
.stat .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:400;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.low b{color:var(--hot);animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.18)}}
.meter{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:0;background:var(--rainbow);background-size:200% 100%;border-radius:99px;
  box-shadow:0 0 12px rgba(255,255,255,.7);transition:width .15s ease-out;animation:slide 2s linear infinite}
@keyframes slide{to{background-position:-200% 0}}
.count{font-size:12px;font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-weight:900}
.ib{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:var(--glass);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ib svg{width:18px;height:18px}
.ib .x{display:none}
.ib.off .x{display:block}
.ib.off .w{display:none}

#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:2;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;transition:opacity .4s}
#hint span{display:inline-block;padding:9px 16px;border-radius:99px;background:var(--glass);font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 24px rgba(160,90,255,.35);backdrop-filter:blur(6px)}

#ov{position:fixed;inset:0;z-index:3;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  background:radial-gradient(ellipse at center,rgba(11,3,32,.25),rgba(11,3,32,.7))}
#ov[hidden]{display:none}
.card{position:relative;width:min(380px,100%);box-sizing:border-box;padding:26px 22px 22px;border-radius:28px;text-align:center;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--rainbow) border-box;border:3px solid transparent;
  box-shadow:0 0 40px rgba(255,120,220,.35),0 0 90px rgba(90,160,255,.25);backdrop-filter:blur(10px)}
.logo{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,56px);line-height:.92;text-wrap:balance;
  background:var(--rainbow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,255,255,.35));animation:slide 4s linear infinite}
.card h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;text-wrap:balance;
  background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:0 0 14px;color:var(--muted);font-weight:600;font-size:15px;line-height:1.45}
.how{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px;text-align:left}
.how div{padding:11px 12px;border-radius:16px;font-size:13px;line-height:1.35;font-weight:600;color:var(--ink)}
.how b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.how .l{background:linear-gradient(140deg,rgba(255,240,170,.22),rgba(255,140,220,.18));box-shadow:inset 0 0 0 1px rgba(255,240,190,.35)}
.how .l b{color:var(--gold)}
.how .d{background:linear-gradient(140deg,rgba(60,20,130,.6),rgba(20,5,50,.6));box-shadow:inset 0 0 0 1px rgba(170,120,255,.4)}
.how .d b{color:#c49bff}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-family:var(--display);font-size:22px;padding:13px 18px;border-radius:99px;border:0;cursor:pointer;color:#22093f;
  background:var(--rainbow);background-size:200% 100%;animation:slide 3s linear infinite;box-shadow:0 0 26px rgba(255,255,255,.35)}
.btn.alt{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);animation:none;font-size:18px}
.stats{display:flex;justify-content:center;gap:22px;margin:4px 0 16px}
.stats div{display:flex;flex-direction:column;line-height:1.1}
.stats b{font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.how .v{grid-column:1/-1;background:linear-gradient(100deg,rgba(255,80,140,.25),rgba(255,200,60,.2),rgba(80,220,255,.22),rgba(170,90,255,.25));box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.how .v b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:min(48vh,400px);overflow-y:auto;padding:4px;margin:0 0 14px}
.grid button{font:inherit;font-family:var(--display);font-size:18px;aspect-ratio:1;border-radius:14px;border:0;cursor:pointer;color:var(--ink);
  background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.grid button.done{background:linear-gradient(140deg,hsl(var(--h),95%,62%),hsl(calc(var(--h) + 70),95%,62%));color:#1a0640}
.grid button:disabled{opacity:.28;cursor:default}
.grid button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);z-index:2;pointer-events:none;
  padding:6px 14px;border-radius:99px;background:var(--glass);font-size:13px;font-weight:800;color:var(--ink);opacity:0;transition:opacity .5s;
  white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
@media (prefers-reduced-motion:reduce){.logo,.btn,.bar i{animation:none}.stat.low b{animation:none}}
</style>

<canvas id="game" aria-label="Game area: hold and drag to move the princess in light mode, let go to absorb colors in dark mode"></canvas>

<div id="hud">
  <div class="stat"><span class="lbl">Level</span><b id="lvl">1</b></div>
  <div class="meter">
    <div class="bar"><i id="fill"></i></div>
    <div class="count"><b id="cnt">0</b> / <span id="tgt">40</span> pixels</div>
  </div>
  <div class="stat" id="timeBox"><span class="lbl">Time</span><b id="tm">60</b></div>
  <button id="musBtn" class="ib" type="button" aria-label="Music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/><path class="x" d="M3 3l18 18"/></svg>
  </button>
  <button id="sfxBtn" class="ib" type="button" aria-label="Sound effects">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</div>

<div id="toast"></div>
<div id="hint" style="opacity:0"><span id="hintTxt"></span></div>

<div id="ov">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

let W = 0, H = 0, DPR = 1, U = 1, TOP = 60;
// quality steps down if frames run slow on a phone: canvas resolution and particle caps
const RS_MAX = [1.75, 1.35, 1];
const PIX_CAP = [900, 700, 500], SPARK_CAP = [500, 350, 220];
let quality = 0;
let stars = [];

/* ---------- state ---------- */
const P = { x: 0, y: 0, tx: 0, ty: 0, tilt: 0, light: false, charge: 1, pulse: 0 };
const G = { mode: "menu", lvl: 0, cfg: null, count: 0, time: 0, spawnT: 0.5, combo: 0, comboT: 0, bestCombo: 0,
            shake: 0, hitstop: 0, t: 0, wonT: 0, fwT: 0, hint: 0, splits: 0, overlayShown: false,
            lastSplit: -9, vortex: 0, vortexGain: 0, vortexCount: 0, crossTip: false };
const VORTEX_TIME = 1.6;
let beams = [], pix = [], sparks = [], rings = [], flashes = [];

let best = 0;
try { best = parseInt(localStorage.getItem("ppp-best") || "0", 10) || 0; } catch (e) {}

/* ---------- levels ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Each theme bends the base difficulty curve in one direction so neighbouring levels feel different.
const THEMES = {
  glow:   { name: "Gentle Glow",    m: { interval: 1.15, speed: .85 }, eff: .8 },
  rain:   { name: "Laser Rain",     m: { interval: .55, speed: 1.2, power: .6, len: .7 } },
  cross:  { name: "Crossfire",      set: { cross: .75 }, eff: 1.1 },
  fade:   { name: "Fading Fast",    m: { life: .55 }, eff: .75 },
  honey:  { name: "Slow Honey",     m: { speed: .6, fric: 1.6, life: 1.15 } },
  prism:  { name: "Prism Party",    set: { prism: .5 } },
  lance:  { name: "Long Lances",    m: { len: 2.2, speed: .85 } },
  bounce: { name: "Bouncy Castle",  m: { fric: .55 }, set: { bounce: .97 } },
  twins:  { name: "Twin Stars",     set: { dbl: .85 } },
  sprink: { name: "Sprinkles",      m: { power: .5, interval: .55 } },
  comet:  { name: "Comet Rush",     m: { speed: 1.55, warn: .8 }, eff: .9 },
  lull:   { name: "Starlight Lull", m: { interval: 1.5, power: 1.5 }, eff: .95 },
  storm:  { name: "Rainbow Storm",  m: { interval: .72, speed: 1.12 }, add: { dbl: .25, cross: .15, prism: .1 }, eff: 1.25 },
};
const ORDER = ["cross", "honey", "prism", "rain", "twins", "fade", "lance", "bounce", "sprink", "comet", "lull", "glow"];
const LEVELS = (() => {
  const rng = mulberry32(20261103), out = [];
  let prev = "";
  for (let i = 0; i < 100; i++) {
    const d = i / 99;
    const c = { interval: lerp(2.6, 1.2, d), speed: lerp(460, 900, d), power: lerp(28, 42, d), life: lerp(8, 5.2, d),
      dbl: lerp(0, .4, d), cross: lerp(.12, .35, d), prism: lerp(.03, .2, d), len: 150, warn: lerp(1, .55, d),
      fric: 1.9, bounce: .8, time: 60 + 5 * Math.floor(rng() * 5) };
    const supply = c.time / c.interval * (1 + c.dbl + c.cross) * c.power * (1 + c.prism * 1.2);
    let key;
    if (i === 0) key = "glow";
    else if (i === 1) key = "cross";
    else if (i % 10 === 9) key = "storm";
    else { do key = ORDER[Math.floor(rng() * ORDER.length)]; while (key === prev); }
    prev = key;
    const th = THEMES[key];
    for (const k in th.m || {}) c[k] *= th.m[k];
    for (const k in th.set || {}) c[k] = th.set[k];
    for (const k in th.add || {}) c[k] += th.add[k];
    c.warn = Math.max(.45, c.warn);
    const eff = lerp(.065, .16, Math.pow(d, .9)) * (th.eff || 1) * (.93 + rng() * .15);
    c.target = i === 0 ? 40 : Math.max(45, Math.round(supply * eff / 5) * 5);
    c.name = th.name;
    out.push(c);
  }
  return out;
})();
const cfgFor = i => LEVELS[Math.min(i, LEVELS.length - 1)];

/* ---------- sizing ---------- */
function resize() {
  DPR = Math.min(RS_MAX[quality], window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = clamp(Math.min(W, H) / 420, .75, 1.8);
  TOP = $("hud").getBoundingClientRect().bottom || 60;
  stars = [];
  const n = Math.round(W * H / 4200);
  for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: rand(.3, 1.5), p: rand(0, TAU), s: rand(.6, 2.4), h: rand(0, 360) });
  if (!P.x) { P.x = P.tx = W / 2; P.y = P.ty = H * .62; }
  P.x = P.tx = clamp(P.x, 24 * U, W - 24 * U);
  P.y = P.ty = clamp(P.y, TOP + 30 * U, H - 30 * U);
}
window.addEventListener("resize", resize);

/* ---------- glow sprites ---------- */
const glowCache = new Map();
function glowSprite(h, s = 100, l = 60) {
  const key = h + "|" + s + "|" + l;
  let c = glowCache.get(key);
  if (c) return c;
  const S = 64;
  if (glowCache.size > 400) glowCache.clear();
  c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, `hsla(${h},${s}%,${Math.min(97, l + 32)}%,1)`);
  gr.addColorStop(.16, `hsla(${h},${s}%,${l}%,.8)`);
  gr.addColorStop(.42, `hsla(${h},${s}%,${l - 6}%,.22)`);
  gr.addColorStop(1, `hsla(${h},${s}%,${l - 12}%,0)`);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  glowCache.set(key, c);
  return c;
}
const hk = h => ((Math.round(h / 6) * 6) % 360 + 360) % 360;
const WHITE = () => glowSprite(50, 100, 66);
const nebula = [[290, 0.18], [200, 0.14], [330, 0.13], [160, 0.1]].map(([h, a], i) => ({ h, a, i }));

/* ---------- audio ---------- */
let liveVoices = 0;
let AC = null, sfxBus = null, musBus = null, revIn = null, noiseBuf = null, lastBlip = 0;
let sfxOn = true, musOn = true;
try { sfxOn = localStorage.getItem("ppp-sfx") !== "0"; musOn = localStorage.getItem("ppp-mus") !== "0"; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(AC.destination);
    const out = AC.createGain(); out.gain.value = .9; out.connect(comp);
    sfxBus = AC.createGain(); sfxBus.gain.value = sfxOn ? .6 : 0; sfxBus.connect(out);
    musBus = AC.createGain(); musBus.gain.value = musOn ? .3 : 0; musBus.connect(out);
    const len = Math.floor(AC.sampleRate * 1.3), ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    const conv = AC.createConvolver(); conv.buffer = ir;
    revIn = AC.createGain(); revIn.gain.value = .35; revIn.connect(conv);
    const rg = AC.createGain(); rg.gain.value = .55; conv.connect(rg); rg.connect(out);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { AC = null; }
}
function send(node, amt) { if (amt) { const s = AC.createGain(); s.gain.value = amt; node.connect(s); s.connect(revIn); } }
function voice(bus, freq, t0, dur, o = {}) {
  if (liveVoices > 70) return;
  const { type = "sine", vol = .2, attack = .005, rev = 0, slide = 0, detune = 0 } = o;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0); if (detune) osc.detune.value = detune;
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(g); g.connect(bus); send(g, rev); osc.start(t0); osc.stop(t0 + dur + .05);
  liveVoices++; osc.onended = () => { liveVoices--; osc.disconnect(); g.disconnect(); };
}
function noise(bus, t0, dur, o = {}) {
  if (liveVoices > 70) return;
  const { vol = .2, type = "highpass", f = 6000, f2 = 0, q = 1, rev = 0 } = o;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t0); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur); fl.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(fl); fl.connect(g); g.connect(bus); send(g, rev); s.start(t0, Math.random() * .5); s.stop(t0 + dur + .05);
  liveVoices++; s.onended = () => { liveVoices--; s.disconnect(); fl.disconnect(); g.disconnect(); };
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PENT = [0, 2, 4, 7, 9];
const pent = (i, base = 84) => base + PENT[((i % 5) + 5) % 5] + 12 * Math.floor(i / 5);
function bell(bus, m, t0, dur, vol, rev) {
  const f = mtof(m);
  voice(bus, f, t0, dur, { vol, rev });
  voice(bus, f * 2.756, t0, dur * .45, { vol: vol * .3, rev });
}
const sfx = {
  split(prism) {
    if (!AC || !sfxOn) return; const t = AC.currentTime;
    noise(sfxBus, t, .55, { vol: .1, f: 7500, rev: .7 });
    noise(sfxBus, t, .25, { vol: .08, type: "bandpass", f: 9000, f2: 3000, q: 3 });
    const n = prism ? 10 : 7;
    for (let i = 0; i < n; i++) bell(sfxBus, pent(Math.floor(rand(0, 9)) + (prism ? 2 : 0)), t + i * rand(.012, .03), rand(.35, .75), .055, .8);
    voice(sfxBus, mtof(96), t, .3, { vol: .04, slide: mtof(110), rev: .5 });
    if (prism) for (let i = 0; i < 6; i++) bell(sfxBus, pent(i * 2, 72), t + .06 + i * .045, 1, .06, 1);
  },
  absorb(c) {
    if (!AC || !sfxOn) return; const now = performance.now(); if (now - lastBlip < 45) return; lastBlip = now;
    const t = AC.currentTime, m = pent((c % 13) - 2, 79);
    voice(sfxBus, mtof(m), t, .45, { vol: .07, attack: .004, rev: .6 });
    voice(sfxBus, mtof(m) * 2, t, .18, { vol: .02, rev: .4 });
